<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EPSILON 2K26 | Department of EEE | MSEC</title>

  <!-- SEO -->
  <meta name="description" content="EPSILON 2K26 — National Level Technical Symposium, Department of EEE, Meenakshi Sundararajan Engineering College." />
  <meta name="theme-color" content="#0a0000" />

  <!-- FAVICONS -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-33C9Y0EVMG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-33C9Y0EVMG');
  </script>

  <style>
    /* Prevent white flash before React mounts */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { background: #000; margin: 0; padding: 0; min-height: 100dvh; }
    #root { min-height: 100dvh; }
  </style>

  <script>
    // ── FIRST-VISIT REDIRECT ─────────────────────────────────────────────────
    // On very first visit to "/" (no introSeen flag) → redirect to
    // epsilon-intro.html BEFORE React boots. Zero white flash.
    //
    // epsilon-intro.html will:
    //   1. Play the Stranger Things intro animation
    //   2. User clicks "Enter the Upside Down ⚡"
    //   3. Sets sessionStorage.introSeen = '1'
    //   4. Navigates to /home
    //   → React mounts → LoadingScreen plays → full app renders
    //
    // On every subsequent refresh: introSeen is already set → skip intro,
    // go straight to app (LoadingScreen plays on every refresh as requested).
    // ────────────────────────────────────────────────────────────────────────
    (function () {
      if (window.location.pathname === '/' && !sessionStorage.getItem('introSeen')) {
        sessionStorage.setItem('introSeen', '1');
        window.location.replace('/epsilon-intro.html');
      }
    })();
  </script>
</head>

<body>
  <!-- React app — LoadingScreen.jsx mounts here on every hard load/refresh -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
